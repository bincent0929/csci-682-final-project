[project]
name = "final-project"
version = "0.1.0"
description = "A language model built using a morpheme-based tokenizer (morphizer)"
readme = "README.md"
authors = [
    { name = "Vincent", email = "git@varmail.org" },
    { name = "Harsh", email = "harshthesharma@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.2.0",
    "ftfy>=6.3.1",
    "matplotlib>=3.11.2",
    "morphemes>=1.2.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "torch>=2.14.1",
]

[project.scripts]
final-project = "final_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true